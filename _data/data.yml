publications:
  title: Publications
  intro: |
    Here are some of my pubslished papers.
  papers:
  - title: "Setting Point and Operation Range of a BiCMOS On-Chip BiCMOS Thermometer"
    link: "#"
    authors: "**B. TON**, S. CHEN, D. PRELE, M. GONZALEZ"
    conference: Journal of Sensor and Transducer, 2023
    abstract: >
      Thermometer circuit can be designed in BiCMOS technology to measure directly the on-chip temperature right close to other functions of an Application Specific Integrated Circuit (ASIC). This paper discusses on-chip thermometry with high temperature sensitivity. The setting of an operating point around 50 °C with no-offset is discussed allowing a multiplication of the output current times ten for a better sensitivity. An analytical model based on a proportional to temperature cell and a complementary to absolute temperature cell is discussed. Linear response in the [-150 °C: +150 °C] is illustrated. However, out from this range, deviations between analytical models and simulations based on foundry models are discussed pointing the importance of the setting point depending on the temperature range.
    
  - title: "High Sensitivity On-chip BiCMOS Thermometer with Differential Output and Offset Nulling"
    link: "#"
    authors: "**B. TON**, S. CHEN, D. PRELE, M. GONZALEZ"
    conference: "International Conference on Microelectronic Devices and Technologies (MicDAT 2023), Funchal (Madeira Island), Portugal"
    abstract: >
      Measuring the temperature of an electronic chip/die is a usual way to survey and counteract thermal drifts in an ultimately stable integrated circuit. More accurate than using a thermometer glued on a chip, an on-chip Thermometer could be designed to measure directly the internal temperature right close to other functions of an Application Specific Integrated Circuit (ASIC). This paper discusses on-chip thermometry and proposes a high-sensitivity on-chip thermometer using the temperature dependence property of semiconductors in a BiCMOS technology. Moreover, the signals provided by this circuit can be turned to differential and set to zero around a given temperature. This allows direct amplification leading to a significant increase in the thermal sensitivity. Differential signals prevent common-mode noise contaminations from the thermometer off-chip readout.


  - title: Impact of space ionizing environment on the warm front-end electronics flicker noise used for TES/SQUID readout
    link: "#"
    authors: "**B. TON**, M.GONZALEZ, H. ARNALDI, S. CHEN, D.PRELE"
    conference: "SPIE: Space Telescopes and Instrumentation 2024: Ultraviolet to Gamma Ray, Yokohama 2024"
    doi: 10.1117/12.3020756
    abstract: > 
      ATHENA will be ESA’s next generation X-ray space observatory. The X-ray integrated field unit (X-IFU) instrument will be ATHENA’s cryogenic spectro-imager. In this work, we present total ionizing dose (TID) tests performed on an application specific integrated circuit (ASIC) designed for X-IFU’s warm front-end electronics (WFEE). In particular, space environment ionizing particles could cause an increase of flicker noise, affecting the performances of such a detection chain readout. We present low frequency noise measurements of the main components of the WFEE (low noise amplifier and slow current DAC) and the effect of total ionizing dose (TID). Five ASICs were irradiated up to 200 krad with a 60Co source. We discuss the impact on the noise of such radiation effects beyond the life-time of a space mission as ATHENA.
  
  - title: ASIC design evolution of ATHENA X-IFU warm front-end electronics
    link: "#"
    authors: "S. CHEN, D.PRELE, M. GONZALEZ, J. MESQUIDA, B. COURTY, M. PUNCH, L. ARNALDI, **B. TON**, J. LESREL"
    conference: "SPIE: Space Telescopes and Instrumentation 2024: Ultraviolet to Gamma Ray, Yokohama 2024"
    doi: 10.1117/12.3020115
    abstract: > 
      This paper gives a review of the ASIC design evolutions of the WFEE in the context of the ATHENA mission. The development follows the evolutions of the X-IFU instrument detection chain and secures the ASIC technology access continuity by using an ST SiGe 130 nm technology instead of the previous use of an AMS SiGe 350 nm node. First ASIC prototypes based on this ST 130 nm SiGe technology have been developed to answer these technical challenges and meet the new requirements. This paper will give a brief review of these ASICs dedicated to the WFEE.

  - title: Non Multiplexed SQUID Readout Electronics for Large Detector Arrays
    link: "#"
    authors: "M.GONZALEZ, D. PRELE, **B. TON**, G. ONEIL, A. ROY, K. SAKAI, S. BANDLER"
    conference: "IEEE Transactions on Applied Superconductivity, 2026"
    doi: 10.1109/TASC.2026.3675489
    abstract: > 
      Large arrays of sensors operating at mK temperatures are desirable for applications including X-ray satellites missions. Proposed designs for these arrays often rely on multiplexing methods which read out many sensors while requiring less than one additional wire for every additional sensor. Here, we consider the possibility of non-multiplexed readout of a 10,000 pixel sensor array, where each pixel has an individual DC SQUID read out with an individual analog feedback circuit. We focus on the total power dissipation of a non-multiplexed readout. We present an ASIC-compatible SQUID feedback circuit meeting proposed noise and bandwidth requirements that dissipates only 10mW per channel, or a total of 100W for 10,000 channels. We show that total power consumption cannot be reduced by operating this circuit at the 75K temperature stage of a cryostat. We predict the power load from 60,000 wires running to the base temperature of a cryostat, and show that with resistances compatible with the feedback circuit and feasible with current commercial capabilities that the power loads are below the cooling capacity of a cryostat proposed for an X-ray satellite mission.

