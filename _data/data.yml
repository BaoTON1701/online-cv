career-profile:
  title: Career Profile
  summary: |
    I have received the B.S. and M.S. degrees
    from the University of Science and Technology at
    Hanoi (USTH), Vietnam. I'm currently pursuing
    the Ph.D. degree at the Astroparticle and Cosmology Laboratory (APC), Université Paris Cité, Paris,
    France, which I started in December 2023. My
    research focuses on the impact of flicker noise on
    the design methodology of SiGe BiCMOS integrated
    circuits for astronomical observations. I'm also a
    member of the R&T BiCMOS Project
