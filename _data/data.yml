projects:
  title: Projects
  intro: >
    This is the project that I have been working on.
  assignments:
  - title: R&T BiCMOS 
    link: "https://apc.u-paris.fr/en/rt-bicmos"
    tagline: "This IN2P3 R&T project compares available BiCMOS technologies to identify a sustainable and affordable option for high-performance, front-end analog electronics. While many ASICs move to full CMOS, BiCMOS remains essential for low-noise (astronomy) and high-dynamic-range (medical) needs. The project aims to establish figures of merit and streamline future ASIC developments in space, astro, nuclear, and medical applications."

